name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than publishing out of order.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      # Served from a custom domain, so the site sits at the domain root and
      # PAGES_BASE stays unset (vite.config.ts defaults it to "/"). If this ever
      # moves back to johin-k-giji.github.io/<repo>/, set
      # PAGES_BASE="/${GITHUB_REPOSITORY#*/}/" here or every asset URL 404s.
      - name: Build static site
        run: bun run build

      - name: Add Pages fallbacks
        run: |
          # The prerendered SPA shell doubles as the 404 page, so client-side
          # routes survive a deep link or a refresh.
          cp .output/public/_shell.html .output/public/404.html
          # Without this, Pages runs the output through Jekyll, which strips
          # files and directories beginning with an underscore.
          touch .output/public/.nojekyll
          # The custom domain lives in the repo's CNAME file, which GitHub
          # maintains. An Actions deploy publishes only the artifact, so carry
          # it across or the domain can be dropped on redeploy.
          if [ -f CNAME ]; then cp CNAME .output/public/CNAME; fi

      # `enablement` turns Pages on via the API when the repo has never had it
      # configured, which otherwise fails this step with "Get Pages site failed".
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          # Only the client output is static; .output/server is the unused
          # SSR worker bundle.
          path: .output/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
